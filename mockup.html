<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis Neon Mockup</title>
<style>
  :root {
    --bg: #03060a;
    --panel-bg: rgba(8, 16, 28, 0.8);
    --line: #0e4b82;
    --blue: #007bff;
    --cyan: #00e5ff;
    --green: #00ff88;
    --red: #ff3366;
    --text: #e0f0ff;
    --muted: #5a7d9e;
    --glow-blue: 0 0 12px rgba(0, 123, 255, 0.6);
    --glow-green: 0 0 15px rgba(0, 255, 136, 0.4);
  }
  
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 0%, #061a33 0%, #03060a 60%);
    color: var(--text);
    font: 14px 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding-bottom: 88px;
  }

  /* Background Grid Pattern */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1;
    background-image: linear-gradient(rgba(0, 123, 255, 0.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0, 123, 255, 0.05) 1px, transparent 1px);
    background-size: 20px 20px; pointer-events: none;
  }

  .app { max-width: 430px; margin: auto; padding: 12px 12px 24px; }
  
  /* Header */
  .brand {
    display: flex; align-items: center; gap: 12px; padding: 10px 6px 16px;
    border-bottom: 1px solid var(--line); margin-bottom: 16px;
  }
  .brand .logo {
    flex: 0 0 50px; width: 50px; height: 50px;
    background: #0a1a30; border-radius: 50%; border: 2px solid var(--cyan);
    display: flex; align-items: center; justify-content: center; font-size: 24px;
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
  }
  .brand h1 { font-size: 22px; font-weight: 900; margin: 0; letter-spacing: 2px; color: var(--cyan); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
  .brand small { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 2px; text-transform: uppercase; }

  /* Top Header */
  .top { display: flex; align-items: center; justify-content: space-between; margin: 0 0 16px; padding: 0 6px; }
  .top h2 { margin: 0; font-size: 20px; font-weight: 800; color: #fff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.3); }
  .top p { margin: 4px 0 0; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Panels */
  .panel {
    background: var(--panel-bg); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 123, 255, 0.05); 
    padding: 16px; margin-bottom: 12px; position: relative; overflow: hidden;
    backdrop-filter: blur(10px);
  }
  /* Glowing Top Edge */
  .panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.5;
  }
  .panel h3 { margin: 0 0 12px; font-size: 13px; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; }

  /* Balance Box */
  .hero-balance {
    background: linear-gradient(135deg, rgba(6, 26, 51, 0.9), rgba(0, 50, 40, 0.8));
    border: 1px solid var(--green); border-radius: 12px; padding: 18px;
    margin-bottom: 12px; box-shadow: 0 0 20px rgba(0, 255, 136, 0.15), inset 0 0 20px rgba(0, 255, 136, 0.05);
  }
  .hero-balance small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .hero-balance strong { display: block; font-size: 36px; margin: 4px 0; line-height: 1.1; font-weight: 900; color: #fff; text-shadow: var(--glow-green); }
  .hero-balance .trend { color: var(--green); font-weight: 800; font-size: 13px; letter-spacing: 0.5px; }

  /* Buttons */
  .btn {
    border: 1px solid var(--line); background: rgba(10, 20, 40, 0.8);
    border-radius: 8px; min-height: 42px; padding: 10px 14px; transition: all 0.2s;
    font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 1px; font-size: 12px;
  }
  .btn:active { transform: scale(0.97); filter: brightness(1.5); box-shadow: var(--glow-blue); }
  .btn.primary {
    border: 1px solid var(--cyan); background: linear-gradient(180deg, rgba(0, 123, 255, 0.2), rgba(0, 123, 255, 0.1));
    box-shadow: var(--glow-blue); color: var(--cyan); text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
  }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat {
    background: var(--panel-bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 8px; text-align: center;
  }
  .stat label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat strong { display: block; font-size: 18px; margin-top: 6px; font-weight: 800; color: var(--cyan); }
  .green { color: var(--green) !important; text-shadow: var(--glow-green); }

  /* Nav Bar */
  .nav {
    position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: 0;
    width: min(430px, 100%); display: grid; grid-template-columns: repeat(6, 1fr);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    background: rgba(3, 6, 10, 0.95); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
  }
  .nav button {
    border: 0; background: transparent; text-align: center; padding: 6px 2px; border-radius: 8px;
    color: var(--muted); font-size: 9px; min-height: 53px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
  }
  .nav button .ico { font-size: 20px; line-height: 21px; }
  .nav button.active { background: rgba(0, 123, 255, 0.15); color: var(--cyan); }
  .nav button.active .ico { text-shadow: var(--glow-blue); }
  
  .pill { display: inline-block; padding: 4px 10px; border-radius: 4px; background: rgba(0, 123, 255, 0.15); border: 1px solid var(--blue); color: var(--cyan); font-size: 10px; font-weight: 800; letter-spacing: 1px; }
</style>
</head>
<body>

<div class="app">
  <header class="brand">
    <div class="logo">🦾</div>
    <div>
      <h1>JARVIS</h1>
      <small>System Online</small>
    </div>
  </header>

  <header class="top">
    <div>
      <h2>Dashboard</h2>
      <p>Performance Data</p>
    </div>
    <span class="pill">V 1.0</span>
  </header>

  <div class="hero-balance">
    <small>Account Balance</small>
    <strong>$1,240.50</strong>
    <div class="trend">▲ +$340.50 since start</div>
  </div>

  <div class="stats">
    <div class="stat">
      <label>Resolved</label>
      <strong>42</strong>
    </div>
    <div class="stat">
      <label>Win Rate</label>
      <strong>68.2%</strong>
    </div>
    <div class="stat">
      <label>Trading P/L</label>
      <strong class="green">+$340</strong>
    </div>
  </div>

  <button class="btn primary" style="width:100%; margin-bottom:12px;">+ Log Trade</button>

  <div class="panel">
    <h3>Recent Trades</h3>
    <div style="color: var(--muted); font-size: 11px; text-align: center; padding: 15px; border: 1px dashed var(--line); border-radius: 8px;">
      (Trades table will go here)
    </div>
  </div>
</div>

<nav class="nav">
  <button class="active"><span class="ico">⌂</span>Dashboard</button>
  <button><span class="ico">＋</span>Log</button>
  <button><span class="ico">◷</span>History</button>
  <button><span class="ico">◎</span>Setups</button>
  <button><span class="ico">▥</span>Analytics</button>
  <button><span class="ico">⚙</span>Settings</button>
</nav>

</body>
</html>
